<!DOCTYPE html>
<html>
<body>

<div id="myElement">
  <p id="message">Welcome to my website!</p>
</div>
<button id="changeBtn" type="button">Change Message</button>

<script>
  function changeMessage() {
    document.getElementById("message").innerHTML = "Hello there!";
  }

  document.getElementById("changeBtn").addEventListener("click", changeMessage);
</script>

</body>
</html>
